name: Language Bindings

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'bindings/**'
      - '!bindings/**/*.md'
      - '!bindings/**/*.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'backends/**'
      - 'tests/cpu/python/**'
      - 'tests/cpu/lua/**'
      - 'tests/cpu/julia/**'
      - 'tests/python_align/cpu/**'
      - 'third_party/pybind11/**'
      - 'third_party/sol2/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/language_bindings.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bindings/**'
      - '!bindings/**/*.md'
      - '!bindings/**/*.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'backends/**'
      - 'tests/cpu/python/**'
      - 'tests/cpu/lua/**'
      - 'tests/cpu/julia/**'
      - 'tests/python_align/cpu/**'
      - 'third_party/pybind11/**'
      - 'third_party/sol2/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/language_bindings.yml'
  workflow_dispatch:

jobs:
  python:
    name: Python Binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev \
            cmake \
            build-essential \
            python3-dev \
            python3-numpy \
            python3-pip \
            python3-pytest \
            gnuplot-nox \
            fonts-dejavu-core

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSIGHT_WITH_CUDA=OFF \
            -DINSIGHT_USE_FFTW3=ON \
            -DINSIGHT_USE_OPENBLAS=ON \
            -DINSIGHT_BUILD_TESTS=OFF \
            -DINSIGHT_BUILD_DEMOS=OFF \
            -DINSIGHT_BUILD_BINDINGS=ON \
            -DINSIGHT_BUILD_PYTHON_BINDING=ON \
            -DINSIGHT_BUILD_LUA_BINDING=OFF \
            -DINSIGHT_BUILD_JULIA_BINDING=OFF

      - name: Force recompile matplotplusplus
        run: |
          # Patches are applied by cmake during configure. Touch to force recompile.
          find build/_deps -name gnuplot.cpp -exec touch {} + 2>/dev/null || true
          find build/_deps -name axes_type.h -exec touch {} + 2>/dev/null || true
          [ -f third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp ] && \
            touch third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp || true
          [ -f third_party/matplotplusplus/source/matplot/core/axes_type.h ] && \
            touch third_party/matplotplusplus/source/matplot/core/axes_type.h || true

      - name: Build
        run: cd build && cmake --build . -j$(nproc)

      - name: Test Python binding
        run: |
          # Install Insight via pip (simulates user experience)
          pip install -e .
          # Run tests from an unrelated directory to verify system-wide install
          cd /tmp
          python3 -m pytest $GITHUB_WORKSPACE/tests/cpu/python/ -v --tb=short --ignore=$GITHUB_WORKSPACE/tests/cpu/python/test_plot.py
          python3 -m pytest $GITHUB_WORKSPACE/tests/cpu/python/test_plot.py -v --tb=short

  python-align:
    name: NumPy Alignment (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev \
            cmake \
            build-essential \
            python3-dev \
            python3-numpy \
            python3-scipy \
            python3-pip \
            python3-pytest

      - name: Configure CMake
        run: |
          # matplot/sndfile are off: tests/python_align/cpu touches neither, and
          # skipping them avoids building matplotplusplus + the ogg/vorbis/flac/
          # opus/libsndfile chain from source.
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSIGHT_WITH_CUDA=OFF \
            -DINSIGHT_USE_FFTW3=ON \
            -DINSIGHT_USE_OPENBLAS=ON \
            -DINSIGHT_USE_MATPLOT=OFF \
            -DINSIGHT_USE_SNDFILE=OFF \
            -DINSIGHT_BUILD_TESTS=OFF \
            -DINSIGHT_BUILD_DEMOS=OFF \
            -DINSIGHT_BUILD_BINDINGS=ON \
            -DINSIGHT_BUILD_PYTHON_BINDING=ON \
            -DINSIGHT_BUILD_LUA_BINDING=OFF \
            -DINSIGHT_BUILD_JULIA_BINDING=OFF

      - name: Build
        run: cd build && cmake --build . -j$(nproc)

      - name: Pre-flight import check
        run: |
          # Every file in tests/python_align/cpu/ wraps its imports in
          # `try: ... except ImportError: pytest.skip(allow_module_level=True)`,
          # so a binding that fails to import turns the whole suite into a
          # silent green no-op. Import it here, outside pytest, so the job dies
          # with the real traceback instead.
          # bindings/python/CMakeLists.txt also `return()`s with a mere WARNING
          # when Python3 dev headers are missing — this catches that too.
          pip install -e .
          cd /tmp
          python3 -c "import insight; print('insight:', insight.__file__)"
          python3 -c "import numpy; print('numpy:', numpy.__version__)"
          python3 -c "import scipy.signal, scipy; print('scipy:', scipy.__version__)"

      - name: Verify the alignment suite is fully collected
        run: |
          # Second line of defence against a module-level skip: assert that every
          # test_*.py file actually contributed collected tests. A skipped module
          # silently disappears from the node-id list.
          cd /tmp
          if ! python3 -m pytest "$GITHUB_WORKSPACE/tests/python_align/cpu/" \
                 --collect-only -q --strict-markers > collected.txt; then
            echo "pytest collection returned non-zero; contents follow:"
            cat collected.txt
          fi
          collected_tests=$(awk '/::/ {n++} END {print n+0}' collected.txt)
          collected_modules=$(awk -F'::' '/::/ {print $1}' collected.txt | sort -u | wc -l)
          expected_modules=$(ls "$GITHUB_WORKSPACE"/tests/python_align/cpu/test_*.py | wc -l)
          echo "collected $collected_tests tests from $collected_modules/$expected_modules modules"
          if [ "$collected_modules" -ne "$expected_modules" ]; then
            echo "::error::only $collected_modules of $expected_modules alignment modules collected - a module-level skip is hiding tests"
            cat collected.txt
            exit 1
          fi
          if [ "$collected_tests" -lt 300 ]; then
            echo "::error::only $collected_tests alignment tests collected (expected ~394)"
            exit 1
          fi

      - name: Run NumPy alignment tests (CPU)
        run: |
          # The CUDA half (tests/python_align/cuda/) cannot run here - no GPU on
          # GitHub-hosted runners.
          cd /tmp
          python3 -m pytest "$GITHUB_WORKSPACE/tests/python_align/cpu/" \
            -v --tb=short --strict-markers -rs

  lua:
    name: Lua Binding (LuaJIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev \
            cmake \
            build-essential \
            luajit \
            libluajit-5.1-dev \
            luarocks \
            gnuplot-nox \
            fonts-dejavu-core
          sudo luarocks install busted

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSIGHT_WITH_CUDA=OFF \
            -DINSIGHT_USE_FFTW3=ON \
            -DINSIGHT_USE_OPENBLAS=ON \
            -DINSIGHT_BUILD_TESTS=OFF \
            -DINSIGHT_BUILD_DEMOS=OFF \
            -DINSIGHT_BUILD_BINDINGS=ON \
            -DINSIGHT_BUILD_PYTHON_BINDING=OFF \
            -DINSIGHT_BUILD_LUA_BINDING=ON \
            -DINSIGHT_BUILD_JULIA_BINDING=OFF

      - name: Force recompile matplotplusplus
        run: |
          # Patches are applied by cmake during configure. Touch to force recompile.
          find build/_deps -name gnuplot.cpp -exec touch {} + 2>/dev/null || true
          find build/_deps -name axes_type.h -exec touch {} + 2>/dev/null || true
          [ -f third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp ] && \
            touch third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp || true
          [ -f third_party/matplotplusplus/source/matplot/core/axes_type.h ] && \
            touch third_party/matplotplusplus/source/matplot/core/axes_type.h || true

      - name: Build
        run: cd build && cmake --build . -j$(nproc)

      - name: Test Lua binding
        run: |
          # Use source dir .so files (cmake POST_BUILD copies them there)
          # init.lua pre-loads backend, but LD_LIBRARY_PATH still needed for dlopen fallback
          export LUA_CPATH="$GITHUB_WORKSPACE/bindings/lua/?.so;;"
          export LUA_PATH="$GITHUB_WORKSPACE/bindings/lua/?/init.lua;$GITHUB_WORKSPACE/bindings/lua/?.lua;;"
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/bindings/lua:$LD_LIBRARY_PATH
          # Run tests from an unrelated directory to verify system-wide install
          cd /tmp
          busted --no-auto-insulate --pattern="test_.+%.lua" $GITHUB_WORKSPACE/tests/cpu/lua/

  lua53:
    name: Lua Binding (Lua 5.3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev \
            cmake \
            build-essential \
            lua5.3 \
            liblua5.3-dev \
            luarocks \
            gnuplot-nox \
            fonts-dejavu-core
          sudo luarocks install --lua-version=5.3 busted

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSIGHT_WITH_CUDA=OFF \
            -DINSIGHT_USE_FFTW3=ON \
            -DINSIGHT_USE_OPENBLAS=ON \
            -DINSIGHT_BUILD_TESTS=OFF \
            -DINSIGHT_BUILD_DEMOS=OFF \
            -DINSIGHT_BUILD_BINDINGS=ON \
            -DINSIGHT_BUILD_PYTHON_BINDING=OFF \
            -DINSIGHT_BUILD_LUA_BINDING=ON \
            -DINSIGHT_BUILD_JULIA_BINDING=OFF \
            -DLUA_DIR=/usr

      - name: Force recompile matplotplusplus
        run: |
          # Patches are applied by cmake during configure. Touch to force recompile.
          find build/_deps -name gnuplot.cpp -exec touch {} + 2>/dev/null || true
          find build/_deps -name axes_type.h -exec touch {} + 2>/dev/null || true
          [ -f third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp ] && \
            touch third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp || true
          [ -f third_party/matplotplusplus/source/matplot/core/axes_type.h ] && \
            touch third_party/matplotplusplus/source/matplot/core/axes_type.h || true

      - name: Build
        run: cd build && cmake --build . -j$(nproc) --target insight_lua --target insight_cpu_backend

      - name: Test Lua 5.3 binding
        run: |
          # Use source dir .so files (cmake POST_BUILD copies them there)
          export LUA_CPATH="$GITHUB_WORKSPACE/bindings/lua/?.so;;"
          export LUA_PATH="$GITHUB_WORKSPACE/bindings/lua/?/init.lua;$GITHUB_WORKSPACE/bindings/lua/?.lua;;"
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/bindings/lua:$LD_LIBRARY_PATH
          # Run tests from an unrelated directory to verify system-wide install
          cd /tmp
          busted --lua=lua5.3 --no-auto-insulate --pattern="test_.+%.lua" $GITHUB_WORKSPACE/tests/cpu/lua/

  julia:
    name: Julia Binding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev \
            libomp-dev \
            cmake \
            build-essential \
            gnuplot-nox \
            fonts-dejavu-core

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSIGHT_WITH_CUDA=OFF \
            -DINSIGHT_USE_FFTW3=ON \
            -DINSIGHT_USE_OPENBLAS=ON \
            -DINSIGHT_BUILD_TESTS=OFF \
            -DINSIGHT_BUILD_DEMOS=OFF \
            -DINSIGHT_BUILD_BINDINGS=ON \
            -DINSIGHT_BUILD_PYTHON_BINDING=OFF \
            -DINSIGHT_BUILD_LUA_BINDING=OFF \
            -DINSIGHT_BUILD_JULIA_BINDING=ON

      - name: Force recompile matplotplusplus
        run: |
          # Patches are applied by cmake during configure. Touch to force recompile.
          find build/_deps -name gnuplot.cpp -exec touch {} + 2>/dev/null || true
          find build/_deps -name axes_type.h -exec touch {} + 2>/dev/null || true
          [ -f third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp ] && \
            touch third_party/matplotplusplus/source/matplot/backend/gnuplot.cpp || true
          [ -f third_party/matplotplusplus/source/matplot/core/axes_type.h ] && \
            touch third_party/matplotplusplus/source/matplot/core/axes_type.h || true

      - name: Build
        run: cd build && cmake --build . -j$(nproc)

      - name: Test Julia binding
        run: |
          # Insight.jl auto-preloads backend via Libdl.dlopen — no LD_LIBRARY_PATH needed
          # Run tests from an unrelated directory to verify system-wide install
          cd /tmp
          total_pass=0; total_fail=0; fail_list=""
          for f in $GITHUB_WORKSPACE/tests/cpu/julia/test_*.jl; do
            echo "=== Running $f ==="
            if julia -e "push!(LOAD_PATH, \"$GITHUB_WORKSPACE/bindings/julia\"); include(\"$f\")"; then
              total_pass=$((total_pass + 1))
            else
              total_fail=$((total_fail + 1))
              fail_list="$fail_list $f"
              echo "WARN: $f had errors"
            fi
          done
          echo ""
          echo "=== Julia test summary: $total_pass passed, $total_fail failed ==="
          if [ -n "$fail_list" ]; then
            echo "Failed tests:$fail_list"
            exit 1
          fi
